[tools]
node = "latest"
rust = "latest"

[tasks.install]
description = "Install JavaScript dependencies from the lockfile"
run = "npm ci"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.dev]
description = "Run the Tauri desktop app"
depends = ["install"]
run = "npm run tauri dev"

[tasks.web]
description = "Run the frontend in a browser"
depends = ["install"]
run = "npm run dev"

[tasks.check]
description = "Lint, typecheck, build, and check the Rust application"
depends = ["install"]
run = [
  "npm run lint",
  "npm run build",
  "cargo fmt --manifest-path src-tauri/Cargo.toml --all --check",
  "cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings",
]

[tasks.lint]
description = "Lint the Svelte frontend and Rust application"
depends = ["install"]
run = [
  "npm run lint",
  "cargo fmt --manifest-path src-tauri/Cargo.toml --all --check",
  "cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings",
]

[tasks.format]
description = "Format frontend and Rust sources"
depends = ["install"]
run = ["npm run format", "cargo fmt --manifest-path src-tauri/Cargo.toml --all"]

[tasks.build]
description = "Bundle the desktop app"
depends = ["install"]
run = "npm run tauri build"
